{% extends "base.html" %}

{% block title %}Sign In – Government Job Guide AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-custom p-4 p-sm-5 shadow-lg">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
            <i class="bi bi-box-arrow-in-right"></i>
          </div>
          <h3 class="fw-bold">Welcome Back</h3>
          <p class="text-muted small">Sign in to access your saved guidance and customized career roadmaps.</p>
        </div>

        <form action="{{ url_for('login', next=request.args.get('next', '')) }}" method="POST" id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label for="password" class="form-label mb-0">Password</label>
            </div>
            <div class="input-group mt-1">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
              <label class="form-check-label small text-muted" for="remember">Remember me</label>
            </div>
            <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" id="demoFillBtn">
              <i class="bi bi-magic me-1"></i> Quick Test Fill
            </button>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>

          <div class="text-center small text-muted">
            Don't have an account yet? <a href="{{ url_for('register') }}" class="fw-semibold">Create one for free</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
